name: Build Qt 6.5.3 Static (Ubuntu 22.04)

on:
  workflow_dispatch:      # manual trigger, e.g. from the Actions tab

jobs:
  build-qt:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xz-utils \
            build-essential \
            cmake \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11* \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb* \
            libxkbcommon-x11-dev \
            mesa-common-dev \
            freeglut3 \
            freeglut3-dev \
            libglu1-mesa \
            libglu1-mesa-dev \
            libgl1-mesa-glx \
            libgl1-mesa-dev \
            python3 \
            chrpath \
            zlib1g-dev \
            liblzma-dev \
            libbz2-dev
          sudo apt-get clean

      - name: Download Qt 6.5.3 source
        run: |
          curl -L -o qt-everywhere-src-6.5.3.tar.xz https://download.qt.io/archive/qt/6.5/6.5.3/single/qt-everywhere-src-6.5.3.tar.xz

      - name: Extract source and strip unused modules
        run: |
          tar xf qt-everywhere-src-6.5.3.tar.xz
          cd qt-everywhere-src-6.5.3
          rm -rf qtquickeffectmaker qtgrpc qtscxml qtnetworkauth qt5compat qt3d \
                 qtactiveqt qtcharts qtcoap qtconnectivity qtdatavis3d \
                 qtlanguageserver qtlocation qtmqtt qtlottie qtmultimedia \
                 qtopcua qtpositioning qtremoteobjects qtsensors qtserialbus \
                 qtserialport qtvirtualkeyboard qtwayland qttools qtwebengine \
                 qtdoc qtspeech qttranslations qtwebview qtwebchannel \
                 qtwebsockets qthttpserver

      - name: Configure Qt (static, release)
        working-directory: qt-everywhere-src-6.5.3
        run: |
          ./configure \
            -prefix ${{ github.workspace }}/Qt6.5.3-static \
            -release \
            -static \
            -confirm-license \
            -nomake tests \
            -nomake examples \
            -no-icu \
            -no-dbus \
            -sql-sqlite \
            -xcb \
            -xcb-xlib \
            -bundled-xcb-xinput

      - name: Build Qt
        working-directory: qt-everywhere-src-6.5.3
        run: |
          cmake --build . -j$(nproc)

      - name: Install Qt
        working-directory: qt-everywhere-src-6.5.3
        run: |
          cmake --install . --prefix ${{ github.workspace }}/Qt6.5.3-static

      - name: Tar the installed Qt directory
        working-directory: ${{ github.workspace }}
        run: |  
          XZ_OPT='-9' tar -cJf ${{ github.workspace }}/Qt6.5.3-static-ubuntu2204.tar.xz Qt6.5.3-static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qt6.5.3-static-ubuntu2204
          path: ${{ github.workspace }}/Qt6.5.3-static-ubuntu2204.tar.xz
          retention-days: 14