name: Build Static Qt (macOS)

on:
  workflow_dispatch:      # manual trigger, e.g. from the Actions tab
    inputs:
      runner:
        description: 'macOS runner (13 = Intel, 14 = Apple Silicon)'
        required: true
        default: 'macos-14'
        type: choice
        options:
          - macos-13
          - macos-14
  # push:
  #   paths:
  #     - 'build-qt-static.sh'

jobs:
  build-qt:
    runs-on: ${{ github.event.inputs.runner }}      
    timeout-minutes: 360   # static Qt builds are slow; adjust as needed

    env:
      INSTALL_DIR: ${{ github.workspace }}/qt-install

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cache the downloaded source tarball + extracted tree across runs
      - name: Cache Qt source
        uses: actions/cache@v4
        with:
          path: ~/qt-build
          key: qt-src-6.5.3

      - name: Build static Qt
        run: ./scripts/Qt/build-qt-static-macos.sh
        env:
          INSTALL_DIR: ${{ env.INSTALL_DIR }}

      - name: Upload built Qt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-6.5.3-static-macos
          path: ${{ env.INSTALL_DIR }}
          retention-days: 5