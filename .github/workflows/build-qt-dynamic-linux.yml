name: Build Qt 6.5.3 Dynamic (Ubuntu 22.04)

on:
  workflow_dispatch:
    inputs:
      qt_tag:
        required: false
        type: string
        default: qt-6.5.3-dynamic-ubuntu2204

permissions:
  contents: write

jobs:
  build-qt:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xz-utils build-essential cmake ninja-build \
            libfontconfig1-dev libfreetype6-dev libx11* libxext-dev \
            libxfixes-dev libxi-dev libxrender-dev libxcb* \
            libxkbcommon-x11-dev mesa-common-dev freeglut3 freeglut3-dev \
            libglu1-mesa libglu1-mesa-dev libgl1-mesa-glx libgl1-mesa-dev \
            python3 chrpath zlib1g-dev liblzma-dev libbz2-dev
          sudo apt-get clean

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Download Qt 6.5.3 source
        run: |
          curl -L -o qt-everywhere-src-6.5.3.tar.xz https://download.qt.io/archive/qt/6.5/6.5.3/single/qt-everywhere-src-6.5.3.tar.xz

      - name: Extract source and strip unused modules
        run: |
          tar xf qt-everywhere-src-6.5.3.tar.xz
          cd qt-everywhere-src-6.5.3
          rm -rf qtquickeffectmaker qtgrpc qtscxml qtnetworkauth qt5compat qt3d \
                 qtactiveqt qtcharts qtcoap qtconnectivity qtdatavis3d \
                 qtlanguageserver qtlocation qtmqtt qtlottie qtmultimedia \
                 qtopcua qtpositioning qtremoteobjects qtsensors qtserialbus \
                 qtserialport qtvirtualkeyboard qtwayland qttools qtwebengine \
                 qtdoc qtspeech qttranslations qtwebview qtwebchannel \
                 qtwebsockets qthttpserver qtquick3d* qtquicktimeline

      - name: Configure Qt (dynamic, release)
        working-directory: qt-everywhere-src-6.5.3
        run: |
          ./configure \
            -prefix ${{ github.workspace }}/Qt6.5.3-dynamic \
            -release -confirm-license \
            -nomake tests -nomake examples \
            -no-icu -no-dbus -sql-sqlite \
            -xcb -xcb-xlib -bundled-xcb-xinput

      - name: Build Qt
        working-directory: qt-everywhere-src-6.5.3
        run: cmake --build . -j$(nproc)

      - name: Install Qt
        working-directory: qt-everywhere-src-6.5.3
        run: cmake --install .

      - name: Clean up source tree
        run: |
          rm -rf qt-everywhere-src-6.5.3 qt-everywhere-src-6.5.3.tar.xz
          df -h

      - name: Tar the installed Qt directory
        working-directory: ${{ github.workspace }}
        run: |
          XZ_OPT='-9' tar -cJf Qt6.5.3-dynamic-ubuntu2204.tar.xz Qt6.5.3-dynamic

      - name: Publish as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.qt_tag }}" --repo "${{ github.repository }}" \
            || gh release create "${{ inputs.qt_tag }}" --repo "${{ github.repository }}" \
               --title "Qt 6.5.3 dynamic (Ubuntu 22.04)" \
               --notes "Precompiled Qt 6.5.3, dynamic linking, Ubuntu 22.04"
          gh release upload "${{ inputs.qt_tag }}" Qt6.5.3-dynamic-ubuntu2204.tar.xz \
            --repo "${{ github.repository }}" --clobber
