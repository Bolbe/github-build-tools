name: Shared Qt MacOS Build

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source 
        uses: actions/checkout@v4

      - name: Checkout shared tools
        uses: actions/checkout@v4
        with:
          repository: Bolbe/github-build-tools
          path: build-tools

      - name: Download Qt 6.8.5 Compiler for MacOS (Apple Silicon)
        working-directory: ${{ runner.temp }}
        run: |
          curl -L -o Qt6.8.5-silicon.tar.xz https://github.com/Bolbe/Qt-precompiled/raw/refs/heads/main/macos/Qt6.8.5-silicon.tar.xz
          tar xf ./Qt6.8.5-silicon.tar.xz
          QMAKE=$(find "$PWD" -maxdepth 4 -type f -name qmake -path '*/bin/qmake' | head -n 1)
          if [ -z "$QMAKE" ]; then echo "qmake not found after extraction"; ls -la; exit 1; fi
          echo "QT_PATH=$(dirname "$(dirname "$QMAKE")")" >> "$GITHUB_ENV"

      - name: Compile project and build package
        working-directory: ${{ github.workspace }}
        run: zsh ./build-tools/scripts/applications/macos/build-macos-app.sh ${{ inputs.app_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-macos
          path: ${{ github.workspace }}/${{ inputs.app_name }}.app.zip
          