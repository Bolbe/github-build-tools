name: Shared Qt Windows Build

on:
  workflow_call:
    inputs:
      exe_name:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source 
        uses: actions/checkout@v4

      - name: Checkout shared tools
        uses: actions/checkout@v4
        with:
          repository: Bolbe/github-build-tools
          path: build-tools

      - name: Download MinGW 
        working-directory: ${{ runner.temp }} 
        shell: pwsh 
        run: | 
          curl.exe -L -o mingw64.7z https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-posix-seh-msvcrt-rt_v14-rev1.7z
          7z x mingw64.7z
          
      - name: Download Qt 
        working-directory: ${{ runner.temp }} 
        shell: pwsh 
        run: | 
          curl.exe -L -o Qt6.12.0-mingw64.7z https://github.com/Bolbe/Qt-precompiled/raw/refs/heads/main/windows/Qt6.12.0-mingw64.7z
          7z x Qt6.12.0-mingw64.7z

      - name: Build project
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          QT_PATH: ${{ runner.temp }}/Qt6.12.0-mingw64
          MINGW_PATH: ${{ runner.temp }}/mingw64
        run: ./build-tools/scripts/applications/build-windows-app.ps1 ${{ inputs.exe_name }} ${{ inputs.artifact_name }}
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-windows
          path: ${{ github.workspace }}\${{ inputs.artifact_name }}

